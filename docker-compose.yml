version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lexicode-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: lexicode
      RABBITMQ_DEFAULT_PASS: lexicode_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lexicode-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexicode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lexicode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  redis_data:

networks:
  lexicode-network:
    driver: bridge